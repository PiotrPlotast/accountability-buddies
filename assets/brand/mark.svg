<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB22C"/>
      <stop offset="1" stop-color="#5F8C1A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2FF66"/>
      <stop offset="1" stop-color="#B6EC36"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="top"><rect x="0" y="0" width="1024" height="512"/></clipPath>
    <clipPath id="bottom"><rect x="0" y="512" width="1024" height="512"/></clipPath>
    <!-- top crossing: blue passes over teal, so teal is cut around blue -->
    <mask id="cutTeal" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="662" cy="512" r="225" fill="none" stroke="#000" stroke-width="96" clip-path="url(#top)"/>
    </mask>
    <!-- bottom crossing: teal passes over blue -->
    <mask id="cutBlue" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="362" cy="512" r="225" fill="none" stroke="#000" stroke-width="96" clip-path="url(#bottom)"/>
    </mask>
  </defs>
  
  <g transform="translate(512 512) scale(1) translate(-512 -512)">
    <g filter="url(#glow)" opacity="0.55">
      <circle cx="362" cy="512" r="225" fill="none" stroke="url(#teal)" stroke-width="68"/>
      <circle cx="662" cy="512" r="225" fill="none" stroke="url(#blue)" stroke-width="68"/>
    </g>
    <circle cx="362" cy="512" r="225" fill="none" stroke="url(#teal)" stroke-width="68" mask="url(#cutTeal)"/>
    <circle cx="662" cy="512" r="225" fill="none" stroke="url(#blue)" stroke-width="68" mask="url(#cutBlue)"/>
  </g>
</svg>